name: New version check

on:
  schedule:
    # run every hour (at minute 58)
    - cron: '58 * * * *'
  workflow_dispatch:

jobs:
  check-new-stable:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        stable-branch: [stable, stable-core24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{matrix.stable-branch}}
      - name: Extract current version
        run: ./.github/scripts/extract-current-version.sh
      - name: Install python deps
        run: sudo apt update && sudo apt install python3-lxml python3-packaging
      - name: Fetch new version
        run: |
          version=$(./.github/scripts/check-new-version.py release ${{ env.current_version }})
          echo "new_version=$version" >> $GITHUB_ENV
      - name: Update snapcraft.yaml with the new version
        if: env.new_version
        run: |
          set -x
          if [ $(echo ${{ env.current_version }} | cut -d. -f1) = $(echo ${{ env.new_version }} | cut -d. -f1) ]; then
            sed -i "s/^version: \"\(.*\)\"$/version: \"${{ env.new_version }}\"/" snapcraft.yaml
            git add snapcraft.yaml
            git config user.name "Canonical Github Actions"
            git config user.email "actions@canonical.com"
            git commit -m "Bump version to the latest release candidate (${{ env.new_version }})."
            git push
          else
            echo "New major version (${{ env.new_version }}), please merge the beta branch into the stable one."
            # We don't want this spamming the Mattermost channel, so just allow
            # it to send messages between 10:00 and 11:00.
            if [ "$(date +%H)" = 10 ]; then
              mm_notification=$(printf '{"text": "Merge new major stable Firefox version: %s"}' ${{ env.new_version }})
              curl -s -i -X POST -H 'Content-Type: application/json' -d "$mm_notification" "${{ secrets.MM_URL }}"
            fi
          fi
  check-new-esr:
    strategy:
      matrix:
        esr-branch: [esr]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.esr-branch }}
      - name: Extract current version
        run: ./.github/scripts/extract-current-version.sh
      - name: Install python deps
        run: sudo apt update && sudo apt install python3-lxml python3-packaging
      - name: Fetch new version
        run: |
          version=$(./.github/scripts/check-new-version.py esr ${{ env.current_version }})
          echo "new_version=$version" >> $GITHUB_ENV
      - name: Update snapcraft.yaml with the new version
        if: env.new_version
        run: |
          set -x
          current_esr_major_version=$(echo ${{ env.current_version }} | cut -d. -f1)
          new_esr_major_version=$(echo ${{ env.new_version }} | cut -d. -f1)
          if [ "$current_esr_major_version" = "$new_esr_major_version" ]; then
            sed -i "s/^version: \"\(.*\)\"$/version: \"${{ env.new_version }}\"/" snapcraft.yaml
            git add snapcraft.yaml
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git commit -m "Bump version to the latest ESR release (${{ env.new_version }})."
            git push
          fi
  check-new-beta:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        beta-branch: [beta, beta-core24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{matrix.beta-branch}}
      - name: Extract current version
        run: ./.github/scripts/extract-current-version.sh
      - name: Install python deps
        run: sudo apt update && sudo apt install python3-lxml python3-packaging
      - name: Fetch new version
        run: |
          version=$(./.github/scripts/check-new-version.py beta ${{ env.current_version }})
          echo "new_version=$version" >> $GITHUB_ENV
      - name: Update snapcraft.yaml with the new version
        if: env.new_version
        run: |
          sed -i "s/^version: \"\(.*\)\"$/version: \"${{ env.new_version }}\"/" snapcraft.yaml
          git add snapcraft.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Bump version to the latest beta (${{ env.new_version }})."
          git push
  check-new-nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly
      - name: Extract current version
        run: ./.github/scripts/extract-current-version.sh
      - name: Install deps
        run: sudo apt update && sudo apt install jq
      - name: Fetch new version
        run: ./.github/scripts/check-new-nightly.sh ${{ env.current_version }}
      - name: Update snapcraft.yaml with the new version
        if: env.new_version
        run: |
          sed -i "s/^version: \"\(.*\)\"$/version: \"${{ env.new_version }}\"/" snapcraft.yaml
          git add snapcraft.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Bump version to the latest nightly (${{ env.new_version }})."
          git push
